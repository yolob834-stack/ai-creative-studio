<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Creative Studio • Wan 2.2 Free</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#070b14;color:#e5e7eb}.glass{background:rgba(17,24,39,.75);border:1px solid #263244;backdrop-filter:blur(12px)}
.drop{border:2px dashed #334155}.drop.drag{border-color:#818cf8;background:#111936}button:disabled{opacity:.5}
</style></head>
<body class="min-h-screen"><main class="max-w-4xl mx-auto p-4 md:p-6">
<header class="mb-5"><h1 class="text-3xl font-bold">AI Creative Studio</h1>
<p class="text-slate-400">Wan 2.2 Image → Video • Free ZeroGPU</p></header>
<section class="glass rounded-2xl p-4 md:p-6">
<div id="drop" class="drop rounded-2xl p-8 text-center cursor-pointer">
<input id="file" type="file" accept="image/*" class="hidden">
<div id="empty"><div class="text-4xl">🖼️</div><p class="font-semibold mt-2">Upload reference image</p><p class="text-xs text-slate-500">JPG, PNG or WEBP</p></div>
<div id="preview" class="hidden"><img id="img" class="max-h-72 mx-auto rounded-xl"><p id="name" class="text-xs text-slate-400 mt-2"></p></div></div>
<label class="block text-sm font-medium mt-5">Motion prompt</label>
<textarea id="prompt" rows="4" class="w-full mt-2 rounded-xl bg-slate-950 border border-slate-700 p-3">make this image come alive, cinematic motion, smooth animation</textarea>
<div class="grid md:grid-cols-2 gap-4 mt-5">
<div><label class="text-sm">Duration <span id="dv">3.5s</span></label><input id="duration" type="range" min=".5" max="5" step=".1" value="3.5" class="w-full"></div>
<div><label class="text-sm">Steps <span id="sv">6</span></label><input id="steps" type="range" min="1" max="8" step="1" value="6" class="w-full"></div></div>
<details class="mt-5 border border-slate-800 rounded-xl p-4"><summary>Advanced settings</summary>
<div class="grid md:grid-cols-2 gap-4 mt-4">
<label class="text-sm">Guidance<input id="g1" type="number" min="0" max="10" step=".5" value="1" class="w-full mt-1 bg-slate-950 border border-slate-700 rounded-lg p-2"></label>
<label class="text-sm">Guidance 2<input id="g2" type="number" min="0" max="10" step=".5" value="1" class="w-full mt-1 bg-slate-950 border border-slate-700 rounded-lg p-2"></label>
<label class="text-sm md:col-span-2">Negative prompt<textarea id="neg" rows="3" class="w-full mt-1 bg-slate-950 border border-slate-700 rounded-lg p-2">色调艳丽, 过曝, 静态, 细节模糊不清, 字幕, 风格, 作品, 画作, 画面, 静止, 整体发灰, 最差质量, 低质量, JPEG压缩残留, 丑陋的, 残缺的, 多余的手指, 静止不动的画面, 杂乱的背景, 三条腿, 背景人很多, 倒着走</textarea></label>
<label class="text-sm">Seed<input id="seed" type="number" min="0" max="2147483647" value="42" class="w-full mt-1 bg-slate-950 border border-slate-700 rounded-lg p-2"></label>
<label class="flex items-center gap-2 mt-6 text-sm"><input id="random" type="checkbox" checked> Randomize seed</label>
</div></details>
<button id="go" class="w-full mt-6 py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold">Generate Video</button>
<div id="status" class="hidden mt-4 rounded-xl border p-4 text-sm"></div>
<div id="out" class="hidden mt-5"><h2 class="font-semibold mb-2">Generated video</h2><video id="video" controls autoplay loop playsinline class="w-full rounded-xl bg-black"></video><a id="link" target="_blank" class="inline-block mt-3 text-indigo-300">Open video ↗</a></div>
</section>
<p class="text-xs text-slate-500 text-center mt-4">No FAL API key. Uses a public Hugging Face ZeroGPU Space; availability depends on its shared queue.</p>
</main>
<script type="module">
import {Client,handle_file} from "https://esm.sh/@gradio/client";
const SPACE="zerogpu-aoti/wan2-2-fp8da-aoti-faster"; let selected=null;
const $=id=>document.getElementById(id);
function setImage(f){if(!f||!f.type.startsWith("image/"))return;selected=f;$("empty").classList.add("hidden");$("preview").classList.remove("hidden");$("img").src=URL.createObjectURL(f);$("name").textContent=f.name}
$("drop").onclick=()=>$("file").click();$("file").onchange=e=>setImage(e.target.files?.[0]);
["dragenter","dragover"].forEach(x=>$("drop").addEventListener(x,e=>{e.preventDefault();$("drop").classList.add("drag")}));
["dragleave","drop"].forEach(x=>$("drop").addEventListener(x,e=>{e.preventDefault();$("drop").classList.remove("drag")}));
$("drop").addEventListener("drop",e=>setImage(e.dataTransfer.files?.[0]));
$("duration").oninput=()=>$("dv").textContent=$("duration").value+"s";$("steps").oninput=()=>$("sv").textContent=$("steps").value;
function status(s,err=false){$("status").className="mt-4 rounded-xl border p-4 text-sm "+(err?"border-red-500/30 bg-red-950/30 text-red-200":"border-indigo-500/30 bg-indigo-950/30 text-indigo-200");$("status").textContent=s}
$("go").onclick=async()=>{
if(!selected){status("Please upload an image first.",true);return}
$("go").disabled=true;$("out").classList.add("hidden");
try{
status("Connecting to Wan 2.2 ZeroGPU…");const c=await Client.connect(SPACE);
status("Uploading image and starting generation…");
const r=await c.predict("/generate_video",{input_image:await handle_file(selected),prompt:$("prompt").value.trim(),steps:+$("steps").value,negative_prompt:$("neg").value,duration_seconds:+$("duration").value,guidance_scale:+$("g1").value,guidance_scale_2:+$("g2").value,seed:+$("seed").value,randomize_seed:$("random").checked});
const v=r?.data?.[0],seed=r?.data?.[1];const url=typeof v==="string"?v:(v?.url||v?.path);if(!url)throw Error("No video URL returned.");
$("video").src=url;$("link").href=url;$("link").textContent="Open video ↗ (seed "+(seed??"unknown")+")";$("out").classList.remove("hidden");status("Video generated successfully.");
}catch(e){console.error(e);status("Generation failed: "+(e?.message||e)+". The public Space may be busy or temporarily unavailable; try again.",true)}
finally{$("go").disabled=false}
};
</script></body></html>
